[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every page has its own URL (/session, /teams/zelda, /match/...), so unknown paths must load the app
# and let the router handle them. Without this, refreshing any page except the home page gives a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always be re-checked; hashed assets can be kept forever.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
